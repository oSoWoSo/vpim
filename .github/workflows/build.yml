name: "xut builder"
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/void-linux/void-glibc-full:20250616R1'
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: x86_64
        BOOTSTRAP: x86_64
        TEST: 1

    steps:
      - name: Prepare container
        run: |
          echo
          echo "Sync and update xbps"
          echo
          xbps-install -Syu xbps
          echo
          echo "Install updates"
          echo
          xbps-install -yu
          echo
          echo "Install packages"
          echo
          xbps-install -y bash curl git grep jq make ncurses nodejs shellcheck shfmt sudo tree xtools
          echo
          echo "Add unprivileged 'builder' user"
          echo
          useradd -G xbuilder -M builder

      #- uses: actions/checkout@v5
      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Prepare
        run: |
          echo "chown"
          mkdir -p /home/builder
          chown -R builder:builder . &&
          chown -R builder:builder /github/home &&
          chown -R builder:builder /home/builder &&
          echo
          echo "Add git safe.directory"
          git config --global --add safe.directory '*'
          echo
          echo "Setup passwordless sudo for builder user"
          echo "builder ALL=(ALL) NOPASSWD: ALL" | tee /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Debug Info
        run: |
          echo "=== Environment ==="
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "PWD: $(pwd)"
          echo
          echo "=== User Info ==="
          whoami
          id
          echo
          echo "=== Builder User Info ==="
          sudo -Eu builder whoami
          sudo -Eu builder id

      - name: "Lint using shellcheck"
        id: shellcheck_check
        continue-on-error: true
        run: |
          sudo -Eu builder shellcheck xut | tee /tmp/shellcheck.txt 2>&1 || true
          if [ -s /tmp/shellcheck.txt ]; then
            echo "## ❌ Shellcheck Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            cat /tmp/shellcheck.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "Format check using shfmt"
        id: shfmt_check
        continue-on-error: true
        run: |
          echo

      - name: Apply shfmt fixes if needed
        if: steps.shfmt_check.outcome == 'failure'
        run: |
          echo

      - name: "Create or update PR with fixes if required"
        if: steps.shellcheck_check.outcome == 'failure' || steps.shfmt_check.outcome == 'failure'
        run: |
          git config --global user.name "github Bot"
          git config --global user.email "bot@github.local"

          if ! git diff --quiet 2>/dev/null || ! git diff --cached --quiet 2>/dev/null; then
            BASE_BRANCH="${{ github.ref_name }}"
            BRANCH_NAME="auto-fix-formatting-${BASE_BRANCH}"

            # Prepare commit message
            COMMIT_MSG="🤖 Auto-fix: Code formatting and linting"
            [ "${{ steps.shellcheck_check.outcome }}" = "failure" ] &&
              COMMIT_MSG="${COMMIT_MSG}"$'\n'"- Fixed shellcheck issues"
            [ "${{ steps.shfmt_check.outcome }}" = "failure" ] &&
              COMMIT_MSG="${COMMIT_MSG}"$'\n\n'"- Applied shfmt formatting"

            # Commit changes
            git add -A
            git commit -m "$COMMIT_MSG"

            # Fetch to check if PR branch exists
            git fetch origin
            EXISTING_PR=$(curl -s \
              -H "Authorization: token ${{ secrets.TOKEN }}" \
              "https://codeberg.org/api/v1/repos/${{ github.repository }}/pulls?state=open" \
              | jq -r ".[] | select(.head.ref == \"$BRANCH_NAME\" and .base.ref == \"$BASE_BRANCH\") | .number // empty" \
              | head -n1)

            # Push to PR branch
            git push origin "HEAD:$BRANCH_NAME" --force

            if [ -n "$EXISTING_PR" ]; then
              echo "✓ Updated existing PR #$EXISTING_PR"
            else
              # Create new PR
              curl -X POST \
                -H "Authorization: token ${{ secrets.TOKEN }}" \
                -H "Content-Type: application/json" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/pulls" \
                -d "{
                  \"title\": \"🤖 Auto-fix: Code formatting (from $BASE_BRANCH)\",
                  \"body\": \"This PR was automatically created by CI to fix formatting issues in branch \`$BASE_BRANCH\`.\\n\\n- shellcheck: ${{ steps.shellcheck_check.outcome }}\\n\\n- shfmt: ${{ steps.shfmt_check.outcome }}\\nThis PR will be automatically updated with new fixes as needed.\",
                  \"head\": \"$BRANCH_NAME\",
                  \"base\": \"$BASE_BRANCH\"
                }"
              echo "⚠️ Created new PR: $BRANCH_NAME"
            fi
          else
            echo "✓ No changes to commit"
          fi

      - name: Setup clitest
        run: |
          # Use my fork with verbose and more colors
          curl -sOL https://codeberg.org/oSoWoSo/clitest/raw/branch/main/clitest
          chmod +x clitest
          mv clitest /usr/bin

          cp xut /home/builder/
          cp xut /github/home/

          # Generate tests
          n=1
          for tpl in srcpkgs/*/template; do
            [ -f "$tpl" ] || continue
            pkgdir="${tpl%/template}"
            pkgname="${pkgdir##*/}"
            echo "Creating test for $pkgname"
            printf "## %d. build %s\n\nTest if xut will build %s\n\n\`\`\`bash\n%-50s #=> --egrep Successfully build %s\n\`\`\`\n\n" \
            "$n" "$pkgname" "$pkgname" "$ ./xut -b $pkgname" "$pkgname" | sed '/^[0-9]\+$/d' >> .forgejo/tests.md
            n=$((n + 1))
          done

          echo
          echo "Tests created successfully"
          echo

          echo "Content of Tests.md file:"
          cat .forgejo/tests.md
          cp .forgejo/tests.md /home/builder/ || echo "can't copy tests.md to /home/builder/"
          cp .forgejo/tests.md /github/home/ || echo "can't copy tests.md to /github/home/"
          cp .forgejo/xutconf /home/builder/ || echo "can't copy xutconf to /home/builder/"
          cp .forgejo/xutconf /github/home/ || echo "can't copy xutconf to /github//home/"
          cp .forgejo/xutconf /__w/vpim/vpim/ || echo "can't copy xutconf to /__w/vpim/vpim/"
          sudo -Eu builder cp .forgejo/xutconf /github/home/ || echo "can't copy xutconf to /github/home/"

      - name: xut test
        continue-on-error: true
        run: |
          cd /home/builder
          sudo -Eu builder ./xut -s
          sudo -Eu builder ./xut -b xut

      - name: xut clitest
        continue-on-error: true
        run: |
          cd /home/builder
          sudo -Eu builder clitest --color always tests.md | tee /tmp/out.txt 2>&1 || true
          if [ -s /tmp/out.txt ]; then
            # Remove lines with numbers only
            sudo -Eu builder sed -i '/^[0-9]\+$/d' /tmp/out.txt
            message=$(tail -n1 < /tmp/out.txt)
            echo "## 🧪 Test Results: $message" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            cat /tmp/out.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Show built packages
        if: always()
        run: |
          echo "=== Built Packages ==="
          ls -lh /home/builder/.xut/_void-linux_void-packages/hostdir/binpkgs/ 2>/dev/null || echo "No packages built yet"
          ls /tmp/xut-repos/_void-linux_void-packages/hostdir/binpkgs/ || echo "Directory not found"
          echo
          echo "Current directory:"
          pwd
          echo
          echo "/tmp Directory tree"
          cd /tmp
          tree -d
