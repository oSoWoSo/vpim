name: "xut builder"
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full
      #options: --user runner
      #env:
       # SHELLSPEC_VERSION: '0.28.1'

    steps:
      - name: Install dependencies and create runner user
        run: |
          echo
          echo "Sync and update xbps"
          echo
          xbps-install -Syu xbps
          echo
          echo "Install updates"
          echo
          xbps-install -yu
          echo
          echo "Install packages"
          echo
          xbps-install -y bash curl git jq make ncurses nodejs shellcheck shfmt sudo tree xtools
          echo
          echo "Add unprivileged 'runner' user"
          echo
          useradd -m -u 1000 -s /bin/sh runner
          mkdir -p /home/runner
          echo
          echo "chown"
          echo
          chown -R runner:runner /home/runner
          chown -R runner:runner $RUNNER_WORKSPACE
          echo
          echo "Add git safe.directory"
          echo
          git config --global --add safe.directory "$RUNNER_WORKSPACE/*"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/*"
          git config --global --add safe.directory '/__w/vpim/vpim/*'
          mkdir -p .xut/_void-linux_void-packages/hostdir/binpkgs
          git config --global --add safe.directory '/__w/vpim/vpim/.xut/_void-linux_void-packages/hostdir/binpkgs/*'
          #git config --global --add safe.directory /__w/*
          cd /home/runner
          echo
          echo "Setup passwordless sudo for xi"
          echo
          echo "runner ALL=(ALL) NOPASSWD: ALL" | tee /etc/sudoers.d/runner
          chmod 0440 /etc/sudoers.d/runner

      - uses: actions/checkout@v5

      - name: Debug Info
        run: |
          echo "ENV:"
          env
          echo
          echo
          echo "USER:"
          whoami
          echo
          echo "ID:"
          id
          echo
          echo 'PWD:'
          pwd
          su - runner -c "
            echo 'runner ENV:'
            env
            echo
            echo
            echo 'runner USER:'
            whoami
            echo
            echo 'runner ID:'
            id
            echo
            echo 'PWD:'
            pwd
            "

      - name: "Lint using shellcheck"
        id: shellcheck_check
        continue-on-error: true
        run: |
          su - runner -c "cd '$RUNNER_WORKSPACE' &&
            shellcheck xut" | tee /tmp/shellcheck.txt 2>&1 || true
          if [ -s /tmp/shellcheck.txt ]; then
            echo "## ❌ Shellcheck Issues Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            cat /tmp/shellcheck.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "Format check using shfmt"
        id: shfmt_check
        continue-on-error: true
        run: |
          echo

      - name: Apply shfmt fixes if needed
        if: steps.shfmt_check.outcome == 'failure'
        run: |
          echo

      - name: "Create or update PR with fixes if required"
        if: steps.shellcheck_check.outcome == 'failure' || steps.shfmt_check.outcome == 'failure'
        run: |
          #cd "$RUNNER_WORKSPACE"
          git config --global user.name "github Bot"
          git config --global user.email "bot@github.local"

          if ! git diff --quiet 2>/dev/null || ! git diff --cached --quiet 2>/dev/null; then
            BASE_BRANCH="${{ github.ref_name }}"
            BRANCH_NAME="auto-fix-formatting-${BASE_BRANCH}"

            # Prepare commit message
            COMMIT_MSG="🤖 Auto-fix: Code formatting and linting"
            if [ "${{ steps.shellcheck_check.outcome }}" == "failure" ]; then
              COMMIT_MSG="${COMMIT_MSG}"$'\n'"- Fixed shellcheck issues"
            fi
            if [ "${{ steps.shfmt_check.outcome }}" == "failure" ]; then
              COMMIT_MSG="${COMMIT_MSG}"$'\n\n'"- Applied shfmt formatting"
            fi

            # Commit changes on current branch
            git add -A
            git commit -m "$COMMIT_MSG"

            # Fetch to check if PR branch exists
            git fetch origin

            # Check if PR with this exact branch name already exists
            EXISTING_PR=$(curl -s \
              -H "Authorization: token ${{ secrets.TOKEN }}" \
              "https://codeberg.org/api/v1/repos/${{ github.repository }}/pulls?state=open" \
              | jq -r ".[] | select(.head.ref == \"$BRANCH_NAME\" and .base.ref == \"$BASE_BRANCH\") | .number // empty" \
              | head -n1)

            # Force push current branch to auto-fix branch
            git push origin "HEAD:$BRANCH_NAME" --force

            if [ -n "$EXISTING_PR" ]; then
              echo "✓ Updated existing PR #$EXISTING_PR with new fixes"
            else
              # Create new PR
              curl -X POST \
                -H "Authorization: token ${{ secrets.TOKEN }}" \
                -H "Content-Type: application/json" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/pulls" \
                -d "{
                  \"title\": \"🤖 Auto-fix: Code formatting (from $BASE_BRANCH)\",
                  \"body\": \"This PR was automatically created by CI to fix formatting issues in branch \`$BASE_BRANCH\`.\\n\\n- shellcheck: ${{ steps.shellcheck_check.outcome }}\\n\\n- shfmt: ${{ steps.shfmt_check.outcome }}\\nThis PR will be automatically updated with new fixes as needed.\",
                  \"head\": \"$BRANCH_NAME\",
                  \"base\": \"$BASE_BRANCH\"
                }"
              echo "⚠️ Created new PR with fixes: $BRANCH_NAME"
            fi
          else
            echo "✓ No changes to commit"
          fi

      - name: Setup clitest
        run: |
          # Use my fork with verbose and more colors
          curl -sOL https://codeberg.org/oSoWoSo/clitest/raw/branch/main/clitest
          chmod +x clitest
          mv clitest /usr/bin

          echo "Current branch is: $(git branch --show-current)"
          echo "path is: $(pwd)"
          cp xut /home/runner/

          n=1
          for tpl in srcpkgs/*/template; do
            [ -f "$tpl" ] || continue
            pkgdir="${tpl%/template}"
            pkgname="${pkgdir##*/}"
            echo "Creating test for $pkgname"
            printf "## %d. build %s\n\nTest if xut will build %s\n\n\`\`\`bash\n%-50s #=> --egrep Successfully build %s\n\`\`\`\n\n" \
            "$n" "$pkgname" "$pkgname" "$ ./xut -b $pkgname" "$pkgname" >> .forgejo/tests.md
            n=$((n + 1))
          done

          echo
          echo "Tests created successfully"
          echo

          echo "Content of Tests.md file:"
          cat .forgejo/tests.md
          cp .forgejo/tests.md /home/runner/
          cp .forgejo/xutconf /home/runner/

      - name: xut clitest
        continue-on-error: true
        run: |
          su - runner -c "
            export GITHUB_REPOSITORY_OWNER=$GITHUB_REPOSITORY_OWNER
            clitest --color always tests.md" | tee /tmp/out.txt 2>&1 || true
          if [ -s /tmp/out.txt ]; then
            message=$(tail -n1 < /tmp/out.txt)
            echo "## $message" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            cat /tmp/out.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: push builded packages
        run: |
          echo "#TODO"
          echo "Builded packages:"
          ls -la /tmp/xut-repos/_void-linux_void-packages/hostdir/binpkgs/ || echo "Directory not found"
          echo
          echo "Directory tree"
          tree -d
          echo
          echo "/tmp Directory tree"
          cd /tmp
          tree -d
